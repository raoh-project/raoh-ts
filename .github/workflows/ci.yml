name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Publishing runs all of this on the commit it publishes before it publishes anything.
  workflow_call:

jobs:
  # The tests as they are written, TypeScript run by Node, on the oldest Node that runs them
  # (devEngines) and on the current LTS.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [oldest, lts/*]
    steps:
      - uses: actions/checkout@v4
      - name: The Node to run on
        id: node
        run: |
          if [ "${{ matrix.node }}" = oldest ]; then
            echo "version=$(scripts/oldest-node.sh tooling)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.node }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # What npm packs carries the license and the README beside what tsc wrote.
      - name: The package carries the license and the README
        run: npm pack --dry-run --json | jq -e '.[0].files | map(.path) | index("LICENSE") and index("README.md") and index("dist/index.js")'
      # What the publish workflow does, but the upload: a development version and a release, each
      # from package.json set as it is on develop and as a release sets it, so the path a tag takes
      # is taken before a tag is. Neither turns on the ref CI runs for or on which of the two
      # package.json holds, so CI asks the same here for a pull request, for develop, and when a
      # release runs it on a commit on main.
      - name: Publish, as a dry run, a development version and a release
        run: |
          held="$(jq -r .version package.json)"
          release="${held%-dev}"
          npm version --no-git-tag-version --allow-same-version "$release-dev" > /dev/null
          scripts/publish.sh refs/heads/develop --dry-run
          npm version --no-git-tag-version --allow-same-version "$release" > /dev/null
          scripts/publish.sh "refs/tags/v$release" --dry-run
          git checkout -- package.json package-lock.json

  # The library on the oldest Node a project that installs it may run (engines), which is older
  # than the one the tests need as TypeScript. The tools run on the Node they need, and compile the
  # sources and the tests as the build compiles the sources; only the JavaScript that comes of them
  # is run on the oldest Node, and npm is not run there.
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Nodes to run on
        id: node
        run: |
          echo "tooling=$(scripts/oldest-node.sh tooling)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(scripts/oldest-node.sh runtime)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.tooling }}
          cache: npm
      - run: npm ci
      - run: npm run compile-tests
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.runtime }}
      - name: The compiled tests on the oldest Node engines names
        run: |
          test "$(node --version)" = "v${{ steps.node.outputs.runtime }}"
          node --test target/runtime/test/*.test.js

  # The cases of the Raoh Specification at the commit conformance/spec.lock pins, run on this
  # library and checked by that commit's raoh-verify against conformance/conformance.json.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm ci
      # The catalogue this library ships is the text of the pinned commit's.
      - name: the message catalogue is the pinned specification's
        run: |
          revision="$(jq -er .revision conformance/spec.lock)"
          git clone --quiet https://github.com/raoh-project/raoh-specification.git /tmp/raoh-specification
          git -C /tmp/raoh-specification -c advice.detachedHead=false checkout --quiet --detach "$revision"
          npm run catalog -- /tmp/raoh-specification
          git diff --exit-code src/catalog.ts
      - run: scripts/conformance.sh
        env:
          RAOH_SPECIFICATION_DIR: /tmp/raoh-specification
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            conformance/target/runner-result.json
            conformance/target/conformance-report.json
          if-no-files-found: ignore
